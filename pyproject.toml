[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kortex-benchmark"
version = "0.1.0"
description = "Local LLM benchmarking and model selection system for Ollama + aider workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "OpenAI Codex"}]
dependencies = [
  "pyyaml>=6.0",
  "rich>=13.7.0",
]

[project.scripts]
benchmark = "benchmark.cli.main:main"

[tool.setuptools]
packages = ["benchmark", "benchmark.cli", "benchmark.core", "benchmark.runners", "benchmark.tasks", "benchmark.scoring"]
